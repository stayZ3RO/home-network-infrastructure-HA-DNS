groups:
  - name: phase4-infra
    rules:
      - alert: VIPDNSDown
        expr: probe_success{job="dns_vip"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "VIP DNS probe failed"
          description: "The HA DNS VIP is not answering DNS probes."

      - alert: SingleNodeDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A monitored node is down"
          description: "Node Exporter is not reachable for {{ $labels.instance }}."

      - alert: BothNodesDown
        expr: sum(up{job="node"} == 0) >= 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Both monitored nodes are down"
          description: "Both Pi nodes are unreachable from Prometheus."

      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])) * 100) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "{{ $labels.instance }} CPU usage is above 85% for 15 minutes."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"})) * 100 > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "{{ $labels.instance }} memory usage is above 90% for 15 minutes."

      - alert: LowDiskSpaceRoot
        expr: (node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"}) * 100 < 15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "{{ $labels.instance }} root filesystem has less than 15% free."

      - alert: VIPDNSLatencyHigh
        expr: probe_duration_seconds{job="dns_vip"} > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "VIP DNS latency high"
          description: "VIP DNS probe latency is above 500ms for 10 minutes."
